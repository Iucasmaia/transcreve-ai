name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - name: Package both targets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          (cd dist/chrome && zip -qr "../../transcreve-ai-${VERSION}-chrome.zip" .)
          (cd dist/firefox && zip -qr "../../transcreve-ai-${VERSION}-firefox.zip" .)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" transcreve-ai-*.zip --generate-notes
